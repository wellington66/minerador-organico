name: minerar
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
concurrency: { group: dados, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python minerar.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: salvar
        if: always()
        run: |
          git config user.name robo; git config user.email robo@users.noreply.github.com
          git add data; git diff --cached --quiet && exit 0
          git commit -m "mineração $(date -u +%F_%H%M)"; git pull --rebase -X ours; git push
