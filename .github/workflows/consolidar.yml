name: consolidar
on:
  schedule:
    - cron: "43 23 * * *"
  workflow_dispatch:
concurrency: { group: dados, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python consolidar.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name robo; git config user.email robo@users.noreply.github.com
          git add data; git diff --cached --quiet && exit 0
          git commit -m "cérebro $(date -u +%F)"; git pull --rebase -X ours; git push
